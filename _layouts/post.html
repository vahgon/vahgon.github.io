---
layout: default
---
<article class="h-entry blog-post" itemscope itemtype="http://schema.org/Article">
  <header class="post-info">
    <h1 class="p-name post-title" itemprop="headline name">{{ page.title | escape }}</h1>

    <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">
      {%- assign date_format = date_format | default: "%b %-d, %Y" -%} {{ page.date | date: date_format }}
    </time>

    {%- if page.author -%}
    <span itemprop="author" itemscope itemtype="http://schema.org/Person">
      <span class="p-author h-card" itemprop="name">{{ page.author }}</span>
    </span>
    {%- endif -%}

  </header>

    <div class="e-content post-content" itemprop="articleBody" id="post-content">
      {{ content }}
    </div>

  <a href="{{ page.url | relative_url }}" hidden></a>

</article>
