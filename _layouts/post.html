---
layout: default
---
<article class="post h-entry" itemscope itemtype="http://schema.org/Article">

  <header class="post-header">

    <h1 class="p-name" itemprop="headline name">{{ page.title | escape }}</h1>

    <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{%- assign date_format = date_format | default: "%b %-d, %Y" -%} {{ page.date | date: date_format }}</time>

    {%- if page.author -%}
    <span itemprop="author" itemscope itemtype="http://schema.org/Person">
      <span class="p-author h-card" itemprop="name">{{ page.author }}</span>
    </span>
    {%- endif -%}
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    {{ content }}
  </div>

  <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>

</article>

<div class="hidden"></div>
