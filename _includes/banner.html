<script src="{{ "/assets/js/copy.js" | relative_url "}}"></script>

<header role="banner">
  <div class="display block">

    <h1 class="display block center-justify self">
      {{ site.title | lowcase }}
    </h1>

    <div class="display block center-justify self">

      <nav>
        <ol class="display flex row center-justify self">

            <li>
              <div id="e-li">
                <span id="mask">email</span>
                <span id="info-e" onclick="parse_cpy()">{{ site.email_print }}</span>
              <div>
            </li>

            <li>
              <div id="g-li">
                <span class="separator" id="mask">github</span>
                <span class="separator" id="info-g">@{{ site.github_username }}</span>
              </div>
            </li>

            <li>
              <div id="l-li">
                <span id="mask">linkedin</span>
                <span id="info-l">@{{ site.linkedin_username }}</span>
              </div>
            </li>

        </ol>
      </nav>

    </div>

    <div class="podium">
      <div class="highlight">
        <div class="cover"></div>
      </div>
      <div class="highlight-blur">
        <div class="cover"></div>
      </div>
    </div>

  </div>
</header>
