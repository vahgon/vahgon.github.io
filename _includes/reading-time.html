{%- if include.words > 0 -%}
{%- assign minutes = include.words | divided_by: 180 | ceil -%}

{%- if minutes == 0 -%}
<div itemprop="timeRequired" itemscope itemtype="http://schema.org/CreativeWork" content="PT{{ minutes }}M"> &gt1 min</div>
{%- else -%}
<div itemprop="timeRequired" itemscope itemtype="http://schema.org/CreativeWork" content="PT{{ minutes }}M"> {{ minutes }} mins</div>
{%- endif -%}

{%- endif -%}
